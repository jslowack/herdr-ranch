[package]
name = "ranch-highlight"
version = "0.5.0"
edition = "2021"
description = "Syntax highlighting for Herdr Ranch's diff views, with tree-sitter"
license = "MIT"
publish = false

[[bin]]
name = "ranch-highlight"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cfml = { git = "https://github.com/cfmleditor/tree-sitter-cfml", rev = "24051c091c9c1a69b36914533aee7aa3286d5526", version = "0.26.44" }
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.2"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.13"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
